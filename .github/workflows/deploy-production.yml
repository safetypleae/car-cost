name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: car-cost-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run build:cf
      - name: Validate the generated Worker bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
      - name: Confirm access to the existing car-cost Worker
        run: npx wrangler deployments list --name car-cost
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy existing car-cost Worker
        run: npx wrangler deploy --name car-cost
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
